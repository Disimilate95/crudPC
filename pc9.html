<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lenovo Legion T7</title>
    <style>
        .bt {
            position: absolute;
            top: 2.6px;
            right: 0;
            width: 35px;
            height: 35px;
            margin-left: 5px;
            margin-right: 4px;
            background-color: #1b1b1b;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            transition: background-color 0.3s, right 0.3s, transform 0.4s;
        }
        .bt.spin { animation: spinBtn 0.6s ease; }
        @keyframes spinBtn {
            0% { transform: rotate(0deg) scale(1); }
            50% { transform: rotate(180deg) scale(1.2); }
            100% { transform: rotate(360deg) scale(1); }
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(255,255,255,0.6); }
            70% { box-shadow: 0 0 0 12px rgba(255,255,255,0); }
            100% { box-shadow: 0 0 0 0 rgba(255,255,255,0); }
        }
        .bt.pulse { animation: pulse 0.6s ease-out; }
        .vnutri {
            position: absolute;
            background-color: white;
            width: 80px;
            height: 40px;
            right: 15px;
            top: 20px;
            border-radius: 50px;
            z-index: 100;
        }
        .dark { background-color: rgb(37, 37, 37); color: white; }
        .dark .slov, .dark .pc-specs, .dark .price, .dark .pc-info {
            color: white; background-color: #333; background: #333;
        }
        .moved { right: calc(13vw - 141px); }
        body {
            font-family: Arial, sans-serif;
            margin: 0; padding: 0;
            background-color: #F5F5F5;
            transition: background-color 0.4s, color 0.4s;
            color: black;
        }
        .slov { font-size: 25px; }
        .navbar {
            display: flex; justify-content: space-between; align-items: center;
            background: #333; padding: 15px; color: white; position: relative; z-index: 50;
        }
        .menu { list-style: none; display: flex; gap: 15px; margin: 0; padding: 0; }
        .menu li { display: inline; }
        .menu a {
            color: white; text-decoration: none; padding: 10px;
            transition: background 0.3s, transform 0.2s; display: inline-block;
        }
        .menu a:hover { background: #555; border-radius: 5px; transform: translateY(-2px); }
        .burger { display: none; font-size: 24px; cursor: pointer; }
        .container {
            display: flex; justify-content: center; align-items: flex-start;
            gap: 30px; padding: 50px;
            opacity: 0; transform: translateY(30px);
            transition: opacity 0.7s, transform 0.7s;
        }
        .container.visible { opacity: 1; transform: translateY(0); }
        .image-gallery img {
            width: 400px; height: auto; border-radius: 12px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.2);
            transition: transform 0.4s ease, box-shadow 0.4s;
            opacity: 0; transform: scale(0.92);
        }
        .image-gallery img.visible { opacity: 1; transform: scale(1); }
        .image-gallery img:hover {
            transform: scale(1.05); box-shadow: 0 12px 30px rgba(0, 0, 0, 0.3);
        }
        .pc-info {
            background: white; padding: 25px; border-radius: 12px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.12); width: 400px;
            opacity: 0; transform: translateX(30px);
            transition: opacity 0.6s, transform 0.6s, background 0.3s;
        }
        .pc-info.visible { opacity: 1; transform: translateX(0); }
        .pc-specs { font-size: 18px; line-height: 1.7; }
        .pc-specs p {
            opacity: 0; transform: translateX(15px);
            transition: opacity 0.4s, transform 0.4s;
        }
        .pc-specs p.visible { opacity: 1; transform: translateX(0); }
        .price {
            font-weight: bold; font-size: 24px; margin-top: 18px; color: #d9534f;
            opacity: 0; transform: scale(0.8);
            transition: opacity 0.5s, transform 0.5s;
        }
        .price.visible { opacity: 1; transform: scale(1); }
        @media (max-width: 768px) {
            .container { flex-direction: column; align-items: center; }
            .image-gallery img { width: 300px; }
            .pc-info { width: 90%; }
            .menu {
                display: none; flex-direction: column; background: #333;
                position: absolute; top: 45px; left: 0; width: 140px;
                text-align: left; padding-bottom: 15px; z-index: 100;
            }
            .menu.active { display: flex; }
            .burger { display: block; }
            .bt { top: 2.5px; height: 35px; width: 35px; }
            .moved { right: 37px; }
            .vnutri { top: 10px; }
        }
    </style>
</head>
<body>
    <span class="vnutri">
        <button class="bt" onclick="tema()"></button>
    </span>
    <nav class="navbar">
        <ul class="menu">
            <li><a href="index.html">Главная</a></li>
            <li><a href="onas.html">О нас</a></li>
            <li><a href="uslugi.html">Услуги</a></li>
            <li><a href="contact.html">Контакты</a></li>
        </ul>
        <div class="burger" onclick="toggleMenu()">&#9776;</div>
    </nav>
    <div class="container" id="pcContainer">
        <div class="image-gallery">
            <img id="pcImg" src="https://optim.tildacdn.com/stor3033-6363-4137-b164-373334383035/-/format/webp/66053768.jpg" alt="Lenovo Legion T7">
        </div>
        <div class="pc-info" id="pcInfo">
            <div class="image-caption"><b class="slov">Lenovo Legion T7</b></div>
            <div class="pc-specs" id="pcSpecs">
                <p><b>Процессор:</b> AMD Ryzen Threadripper PRO 5995WX</p>
                <p><b>Видеокарта:</b> NVIDIA GeForce RTX 5090 Ti</p>
                <p><b>ОЗУ:</b> 256GB DDR5 ECC</p>
                <p><b>Накопитель:</b> 8TB SSD NVMe + 10TB HDD</p>
                <p><b>Охлаждение:</b> Кастомная жидкостная система</p>
            </div>
            <div class="price" id="pcPrice">Цена: 9999$</div>
        </div>
    </div>
    <script>
        function tema() {
            document.body.classList.toggle('dark');
            const btn = document.querySelector('.bt');
            btn.classList.toggle('moved');
            btn.classList.toggle('dark');
            document.querySelector('.slov').classList.toggle('dark');
            document.querySelector('.pc-specs').classList.toggle('dark');
            document.querySelector('.pc-info').classList.toggle('dark');
            btn.classList.remove('spin', 'pulse');
            void btn.offsetWidth;
            btn.classList.add('spin', 'pulse');
        }
        function toggleMenu() {
            document.querySelector('.menu').classList.toggle('active');
        }
        document.addEventListener('DOMContentLoaded', function () {
            const container = document.getElementById('pcContainer');
            const img = document.getElementById('pcImg');
            const info = document.getElementById('pcInfo');
            const specs = document.querySelectorAll('#pcSpecs p');
            const price = document.getElementById('pcPrice');
            setTimeout(() => container.classList.add('visible'), 100);
            setTimeout(() => img.classList.add('visible'), 300);
            setTimeout(() => info.classList.add('visible'), 450);
            specs.forEach((p, i) => {
                setTimeout(() => p.classList.add('visible'), 650 + i * 100);
            });
            setTimeout(() => price.classList.add('visible'), 1200);
        });
    </script>
</body>
</html>
